<style>
.popup {
    position: fixed;
    top: 10%;              /* ligeiramente acima do centro */
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8); /* popup menor */
    padding: 2rem;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    text-align: center;
    z-index: 9999;
    opacity: 0;            /* invisível no início */
    pointer-events: none;  /* não interage quando invisível */
    transition: transform 0.4s ease, opacity 0.4s ease; /* animação */
}

.popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1); /* cresce para tamanho normal */
    pointer-events: auto; /* permite interação enquanto visível */
}

.popup.success { background-color: #4CAF50; }
.popup.error   { background-color: #f44336; }
</style>

<div id="popup" class="popup"></div>

<script src="{{ url_for('static', filename='js/popup.js') }}"></script>

{% if popup_message and popup_message.strip() %}
<script>
    showPopup("{{ popup_message }}", "{{ popup_type }}")
</script>
{% endif %}
